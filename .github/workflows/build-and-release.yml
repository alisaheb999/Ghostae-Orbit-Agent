name: Build, Sign & Release Orbit Agent

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore src/Ghostae.Orbit.Agent/Ghostae.Orbit.Agent.csproj

      - name: Build & Publish Release (Self-Contained Win-x64)
        run: |
          dotnet publish src/Ghostae.Orbit.Agent/Ghostae.Orbit.Agent.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o ./publish/OrbitAgent

      - name: Package Release Zip
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/OrbitAgent/* -DestinationPath ./publish/GhostaeOrbitAgent-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./publish/OrbitAgent/Ghostae.Orbit.Agent.exe
            ./publish/GhostaeOrbitAgent-win-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
