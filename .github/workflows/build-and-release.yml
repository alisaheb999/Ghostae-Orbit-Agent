name: Build, Sign & Release Ghostae Orbit Agent

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore src/Ghostae.Orbit.Agent/Ghostae.Orbit.Agent.csproj

      - name: Build & Publish Release (Self-Contained Win-x64)
        run: |
          dotnet publish src/Ghostae.Orbit.Agent/Ghostae.Orbit.Agent.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o ./publish/OrbitAgent

      - name: Package Artifact for SignPath Signing
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/OrbitAgent/Ghostae.Orbit.Agent.exe -DestinationPath ./publish/unsigned-orbit-agent.zip

      - name: Sign Binary via SignPath.io
        uses: SignPath/github-action-submit-signing-request@v1
        id: sign-step
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: 'fb31bf14-d213-4a51-9834-9f1480a0f32e'
          project-slug: 'Ghostae-Orbit-Agent'
          signing-policy-slug: 'Ghostae-Signing-Policy'
          artifact-configuration-slug: 'initial-version'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          input-artifact-filepath: './publish/unsigned-orbit-agent.zip'
          output-artifact-directory: './publish/signed'
          wait-for-completion: true
        continue-on-error: true

      - name: Extract Signed Binary (If signed)
        shell: pwsh
        run: |
          if (Test-Path "./publish/signed") {
            $signedZip = Get-ChildItem -Path "./publish/signed" -Filter "*.zip" | Select-Object -First 1
            if ($signedZip) {
              Expand-Archive -Path $signedZip.FullName -DestinationPath ./publish/OrbitAgent -Force
              Write-Host "[SUCCESS] Extracted SignPath-signed binary!"
            }
          }

      - name: Package Release Bundle
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/OrbitAgent/* -DestinationPath ./publish/GhostaeOrbitAgent-win-x64.zip -Force

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./publish/OrbitAgent/Ghostae.Orbit.Agent.exe
            ./publish/GhostaeOrbitAgent-win-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
