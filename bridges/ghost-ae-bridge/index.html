<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ghost AE Orbit Bridge</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #1e1e1e;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            font-size: 12px;
        }
        .header {
            font-weight: 600;
            color: #eb0029;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .status {
            padding: 8px;
            background: #2a2a2a;
            border-radius: 4px;
            margin-bottom: 12px;
        }
        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            margin-right: 6px;
        }
    </style>
</head>
<body>
    <div class="header">Ghost AE Orbit Bridge</div>
    <div class="status">
        <span class="dot" id="dot"></span>
        <span id="status-text">Connecting to Orbit Agent...</span>
    </div>
    <div id="project-info">Active Project: Detecting...</div>

    <script src="main.js"></script>
</body>
</html>
